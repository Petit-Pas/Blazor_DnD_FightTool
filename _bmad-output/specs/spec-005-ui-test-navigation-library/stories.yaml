- id: "1"
  title: Extract DndUi.Web registrations into RegisterWebAppServices
  description: >-
    Move the inline service registrations in Program.cs into an IoC extension
    taking dataFolder, so Program.cs and the test fixture compose the same host.
  spec_checkpoint: true
  invoke_dev_with: >-
    Pure refactor. No registration may change lifetime, order, or implementation
    type, and dataFolder stays a parameter so the fixture can pass its own.
    Verify DndUi.Web still boots and the fight dashboard works before finishing.
    MauiProgram.cs registers the same services differently; leave it alone here.

- id: "2"
  title: Scaffold /uitests and the application fixture
  description: >-
    Create the /uitests folder with the library project and the gitignored
    scratch shell, plus a fixture that starts the host and manages the browser.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Kestrel must bind a dynamic port. WebApplicationFactory's default TestServer
    is an in-memory transport with no socket and will not work. One browser
    launch per assembly. Finish with a smoke scenario that loads the home page
    and passes, so there is something real to review at the checkpoint.

- id: "3"
  title: Scenario isolation and teardown
  description: >-
    Teardown undoes every command while HistoryLength is above zero, then deletes
    remaining characters through the repository's existing business API.
  spec_checkpoint: true
  invoke_dev_with: >-
    Set CommandHistoryMaxSize to 1000 in the test host composition only, never in
    production. Teardown must assert the state is actually empty after undoing,
    not merely perform the undo; that assertion is the point. Provide an opt-out
    for scenarios whose own subject is undo/redo.

- id: "4"
  title: Screenshot evidence capture
  description: >-
    A named-capture API plus an automatic final-state image per scenario, written
    to a gitignored artifacts folder.
  spec_checkpoint: true
  invoke_dev_with: >-
    Images must be captured on passing runs, not only on failure — the whole
    point is positive evidence. No baseline images and no diffing. Name files by
    scenario and step so a reader can follow them without opening each one.

- id: "5"
  title: Page objects for the five routable pages
  description: >-
    Typed fluent objects for CharacterListEditorPage, FightDashboardPage,
    FightersPage, CharacterEditorPage and AttackEditorPage, with scenarios.
  spec_checkpoint: true
  invoke_dev_with: >-
    Use Playwright role and text locators. Adding a data-testid to production
    markup is a last resort for genuinely ambiguous cases only — call it out
    explicitly whenever you do. No locator expression may appear in a scenario
    file; if one is tempting, the page object is missing a method. Independent
    per-page scenarios derive from IsolatedScenarioFixture. Scope was narrowed at
    the story-5 spec checkpoint: this story covers routable page objects, the
    list/fighters/dashboard component objects and their scenarios. Exhaustive
    field-level editor coverage was split into story 5b.

- id: "5b"
  title: Exhaustive character editor field coverage
  description: >-
    Extend the story-5 character editor page object with component objects that
    drive every field: basic-info (HP, AC, shield), abilities (score, save
    bonus, mastery), skills (mastery up/down, governing ability) and resistances
    (affinity up/down), with UI-to-repository action tests and independent
    repository-to-UI rendering tests for each. Attack editor
    fields were split into story 5c at the 5b spec checkpoint.
  spec_checkpoint: true
  invoke_dev_with: >-
    Build only after story 5 is accepted, on top of its PageObject/ComponentObject
    seam — extend, do not duplicate. The character and attack editor pages already
    exist as page objects; add OpenAbilitiesAndSkills/OpenResistances tab methods
    and the deep-field component objects (AbilityScoresEditor, SkillsEditor,
    ResistancesEditor). Skills/resistances use raw
    MudIconButtons with left-click increase / right-click (@oncontextmenu)
    decrease — locate them within their table row by the adjacent skill/damage-type
    text. Same rules as story 5: no locator in a scenario body, role/text locators,
    IsolatedScenarioFixture. See deferred-work.md DW-015. Layout per
    uitests-layout.md: each Testable{Component} object goes in
    uitests/TestableComponents/UI/TestableCharacterSheetBlazorComponents at its
    component's path; each test goes in
    uitests/Tests/UI/CharacterSheetBlazorComponentsUiTests at the tested
    component's path, named {TestedComponent}UiTests.cs. Use real services, no
    fakes; follow the directional coverage and scoped-draft rules in uitests-layout.md.

- id: "5c"
  title: Attack editor field coverage
  description: >-
    Extend the story-5 attack editor page object with component objects that
    drive the to-hit modifiers and damage rolls (add/delete, damage type, dice
    expression), with UI-to-repository action tests and independently seeded
    repository-to-UI rendering tests for each.
  spec_checkpoint: true
  invoke_dev_with: >-
    Build on story 5b's patterns (state carried in aria-labels, directional
    IsolatedScenarioFixture tests using real services, no fakes). Save the parent
    character before asserting stored attack drafts; do not resolve browser-scoped
    contexts from root Services. Split from 5b at its spec checkpoint for
    spec size. Planned surface: aria-labels on the damage-type menu activator
    ("Damage type: {type}"), the Damages add button ("Add damage") and the
    damage row delete button ("Delete damage"); extend TestableAttackMainInfoEditor
    (To Hit Modifiers) and TestableAttackEditorPage (Damages()); new
    TestableDamageRollTemplateCollectionEditorComponent and
    TestableDamageRollTemplateEditorComponent. The damage-type menu items render
    in a popover outside the component root, so locate them from the page. The
    dice field is an unlabelled textbox, the only one in its damage row. Same
    rules as story 5: no locator in a test body, role/text locators, layout per
    uitests-layout.md.

- id: "6"
  title: Dialog objects, roll input, and the combat scenario
  description: >-
    Typed objects for the four DnDQueryPrompter modals, InitiativeInputDialog and
    RollableDialogBase, proven by a deterministic end-to-end combat scenario.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Pin dice outcomes by typing values into the roll result fields rather than
    stubbing anything. Extract arrangement helpers here only when a scenario
    actually needs one — do not build a flow layer up front. Run the combat
    scenario repeatedly to prove identical log output and HP. Deliverable 1 ends
    here, so the checkpoint review covers the whole library. The multi-step
    combat scenario is the first real use of SequentialScenarioFixture: compose
    it from small [Order]ed stept it isn't a s, each asserting one increment and leaving its
    own screenshots, with state shared across steps and reset only at the fixture
    boundary. Layout per uitests-layout.md: each dialog gets a Testable{Dialog}
    object at its dialog's path (TestableDnDQueryPrompter or
    TestableFightBlazorComponents; seams TestableInitiativeInputDialog and
    TestableMartialAttackRollResultQueryHandlerModal already exist); the combat test
    goes in the origin project of its entry component (FightDashboardPage ->
    uitests/Tests/Components/DndUi.SharedUiTests/Components/Pages). The combat chain is
    a nested SequentialScenarioFixture class inside FightDashboardPageUiTests, per
    the test file shape in uitests-layout.md. The full combat chain supplements
    directional coverage: separately test typed dialog/action inputs against real
    service effects and service-driven state against rendered output, per
    uitests-layout.md. No fakes or test-only service replacements.

- id: "7"
  title: Page-object coverage analyzer
  description: >-
    An analyzer that fails the build when a component carrying an @page directive
    has no corresponding page object.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    The marker-attribute versus AdditionalFiles-manifest choice is a design fork;
    settle it at the spec checkpoint rather than during implementation. Severity
    is error, not warning. Lives in the existing DnDFightTool.Analyzers project,
    netstandard2.0 against Roslyn 4.8. Deliverable 3 is gated on this story.
    Testable projects never reference src/, which rules out a typeof-based marker
    attribute unless that rule is renegotiated; page objects follow the
    Testable{Page} naming at the page's path, which a file-name match can use.

- id: "8"
  title: Instructions, authoring skill, and agent verification workflow
  description: >-
    Update the .razor-scoped instructions file and add the page-object authoring
    skill plus the agent screenshot-evidence workflow.
  spec_checkpoint: true
  invoke_dev_with: >-
    Write this only after stories 1 to 7 are accepted, so the conventions
    documented are the ones that actually shipped rather than the ones that were
    planned. Include UI-to-real-service and real-service-to-UI examples, local-state
    and scoped-draft exceptions, and direction-specific completion waits. Read the
    delivered library first and describe what it does, not what this spec said it would do.
    Also promote the durable rules out of this spec: move the stable conventions of
    uitests-layout.md (placement, naming, namespaces, test file shape, directional
    coverage, no fakes, FluentAssertions-only, Eventually, SetUp fields) into a
    .github/instructions file scoped to uitests/** and the authoring skill, reduce
    the UI-tests section of project-context.md to a short pointer, and keep
    uitests-layout.md as spec-005's record of reviewed coverage and the current
    component map. Future specs must find these rules without reading spec-005.
